name: Upload Python Package to PyPI when a Release is Created

on:
  push:
    branches:
      - main
permissions:
  contents: write  # 🔹 Allow pushing commits

jobs:
  pypi-publish:
    name: Publish release to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/walledai
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel toml build

      - name: Determine version bump type
        id: bump_type
        run: |
          BUMP_TYPE="patch"
          LATEST_COMMIT_MSG=$(git log -1 --pretty=%B)
          if [[ $LATEST_COMMIT_MSG == *"#major"* ]]; then
            BUMP_TYPE="major"
          elif [[ $LATEST_COMMIT_MSG == *"#minor"* ]]; then
            BUMP_TYPE="minor"
          fi
          echo "bump=$BUMP_TYPE" >> $GITHUB_OUTPUT

      - name: Bump version
        id: bump_version
        run: |
          python - <<EOF
          import toml, os

          with open('pyproject.toml', 'r') as f:
              config = toml.load(f)

          current_version = config['project']['version']
          print(f"Current version: {current_version}")

          major, minor, patch = map(int, current_version.split('.'))

          bump_type = "${{ steps.bump_type.outputs.bump }}"
          if bump_type == "major":
              major += 1
              minor = 0
              patch = 0
          elif bump_type == "minor":
              minor += 1
              patch = 0
          else:
              patch += 1

          new_version = f"{major}.{minor}.{patch}"
          config['project']['version'] = new_version

          with open('pyproject.toml', 'w') as f:
              toml.dump(config, f)

          print(f"Version bumped: {current_version} -> {new_version}")
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"new_version={new_version}\n")
              f.write(f"current_version={current_version}\n")
          EOF

      - name: Commit and push version bump
        run: |
          if ! git diff --quiet pyproject.toml; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add pyproject.toml
            git commit -m "Bump version to ${{ steps.bump_version.outputs.new_version }}"
            git push
          else
            echo "No version change detected, skipping commit."
          fi

      - name: Build package
        run: python -m build

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
