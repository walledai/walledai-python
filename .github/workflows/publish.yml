name: Upload Python Package to PyPI when a Release is Created

on:
  push:
    branches:
      - main

jobs:
  pypi-publish:
    name: Publish release to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/walledai
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel toml
      - name: Determine version bump type
        id: bump_type
        run: |
          # Default to patch bump
          BUMP_TYPE="patch"

          # Look at commit message to determine bump type
          LATEST_COMMIT_MSG=$(git log -1 --pretty=%B)
          if [[ $LATEST_COMMIT_MSG == *"#major"* ]]; then
            BUMP_TYPE="major"
          elif [[ $LATEST_COMMIT_MSG == *"#minor"* ]]; then
            BUMP_TYPE="minor"
          fi

          echo "bump=$BUMP_TYPE" >> $GITHUB_OUTPUT

      - name: Bump version
        id: bump_version
        run: |
          python - <<EOF
          import toml
          import os

          # Load the current version
          with open('pyproject.toml', 'r') as f:
              config = toml.load(f)

          current_version = config['project']['version']
          print(f"Current version: {current_version}")

          # Parse version
          version_parts = current_version.split('.')
          major = int(version_parts[0])
          minor = int(version_parts[1])
          patch = int(version_parts[2])

          # Bump based on type
          bump_type = "${{ steps.bump_type.outputs.bump }}"
          if bump_type == "major":
              major += 1
              minor = 0
              patch = 0
          elif bump_type == "minor":
              minor += 1
              patch = 0
          else:  # patch
              patch += 1

          new_version = f"{major}.{minor}.{patch}"

          # Update the version
          config['project']['version'] = new_version

          # Save the updated toml
          with open('pyproject.toml', 'w') as f:
              toml.dump(config, f)

          print(f"Version bumped: {current_version} -> {new_version}")
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"new_version={new_version}\n")
              f.write(f"current_version={current_version}\n")
          EOF
      - name: Build package
        run: |
          pip install build
          python -m build  # Could also be python -m build
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
